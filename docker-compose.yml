version: '3.8'

services:
  # MySQL Database Service
  mysql_db:
    image: mysql:8.0
    container_name: bookmyroute_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookmyroute
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # Backend Spring Boot Service
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmyroute_backend
    ports:
      - "8080:8080"
    environment:
      # Database connection
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql_db:3306/bookmyroute?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=root
      
      # Admin Credentials
      - ADMIN_EMAIL=book.my.route2026@gmail.com
      - ADMIN_PASSWORD=Cr7RMA@9248
      - ADMIN_NAME=BookMyRoute Admin
      
      # SMTP Configuration (UPDATE THESE BEFORE PRODUCTION)
      - MAIL_USERNAME=book.my.route2026@gmail.com
      - MAIL_PASSWORD=pcxwmmdugrghbehv
      
      # Razorpay Gateway (UPDATE THESE BEFORE PRODUCTION)
      - RAZORPAY_KEY_ID=rzp_test_T2LzdodcRLqP3E
      - RAZORPAY_KEY_SECRET=25LfrQKkauYh741RYNFaQNOn
    depends_on:
      mysql_db:
        condition: service_healthy

volumes:
  db_data:
